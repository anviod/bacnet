name: Cross Compile

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  cross:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux/amd64
            goos: linux
            goarch: amd64
            goarm: ""
          - label: linux/arm64
            goos: linux
            goarch: arm64
            goarm: ""
          - label: linux/armv7
            goos: linux
            goarch: arm
            goarm: "7"
          - label: darwin/amd64
            goos: darwin
            goarch: amd64
            goarm: ""
          - label: darwin/arm64
            goos: darwin
            goarch: arm64
            goarm: ""
          - label: windows/amd64
            goos: windows
            goarch: amd64
            goarm: ""
          - label: windows/arm64
            goos: windows
            goarch: arm64
            goarm: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go vet ./...
      - name: Build packages
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build ./...
      - name: Build commands
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -o /tmp/room-simulator ./cmd/room-simulator
          go build -o /tmp/objlist-probe ./cmd/objlist-probe
      - name: Compile tests
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go test -c -o /tmp/encoding.test ./encoding
          go test -c -o /tmp/server.test ./server
          go test -c -o /tmp/roomsim.test ./cmd/room-simulator

  test:
    name: Test (native, race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test packages with race detector
        # Native go test -race over the whole module. Hardware-dependent tests
        # (requiring devices on 192.168.3.x) are guarded by the "integration"
        # build tag and therefore excluded here, so the suite passes on CI.
        run: go test -race ./...